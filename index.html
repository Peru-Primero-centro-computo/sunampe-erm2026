<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunampe ERM 2026 · Control de Actas v21 · Supabase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C2733;--steel:#5B6B7C;--paper:#F4F6F8;--card:#fff;--line:#DDE2E8;--red:#C62828;--redbg:#FDECEC;--green:#2E7D4F;--greenbg:#E7F4EC;--amber:#A86A12;--amberbg:#FDF3E1;--blue:#24507A;--bluebg:#E8EFF6;--gray:#8A96A3;--grayb:#EEF1F4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}main{min-width:0}
aside{background:var(--ink);color:#DCE3EA;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 8px 16px;border-bottom:1px solid #2E3B49;margin-bottom:12px}
.brand b{display:block;font-size:17px;color:#fff;letter-spacing:.2px}
.brand span{font-size:12px;color:#9AA8B6}
aside button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C5D0DB;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
aside button:hover{background:#26333F}
aside button.on{background:#fff;color:var(--ink);font-weight:600}
aside .grp{font-size:11px;color:#7F8E9C;margin:14px 10px 4px}
aside .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
main{padding:22px 26px 60px;max-width:1320px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:700}
.top p{margin:2px 0 0;color:var(--steel);font-size:13px}
.stamp{font-size:12px;color:var(--steel);text-align:right}
.sim{background:var(--amber);color:#fff;padding:6px 12px;border-radius:6px;font-weight:600;font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700}
.card h2 small{font-weight:400;color:var(--steel);font-size:12px;margin-left:6px}
.kpi .l{font-size:12px;color:var(--steel)}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--steel)}
.bar{height:7px;background:var(--grayb);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--steel);font-weight:600;background:#FAFBFC}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.b{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ok{background:var(--greenbg);color:var(--green)}.obs{background:var(--redbg);color:var(--red)}.pen{background:var(--amberbg);color:var(--amber)}.nd{background:var(--grayb);color:var(--steel)}.inf{background:var(--bluebg);color:var(--blue)}
label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin:0 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #C9D1DA;border-radius:6px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid #C9D1DA;background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--grayb)}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.p:hover{background:#2C3A48}
.btn.d{color:var(--red);border-color:#EBC0C0}
.btn.s{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.f{display:grid;gap:12px}
.muted{color:var(--steel);font-size:12px}
.note{background:var(--bluebg);border-left:3px solid var(--blue);padding:10px 12px;font-size:12.5px;color:#1F3B57}
.warn{background:var(--amberbg);border-left:3px solid var(--amber);padding:10px 12px;font-size:12.5px;color:#6B430B}
.alert{background:var(--redbg);border-left:3px solid var(--red);padding:10px 12px;font-size:12.5px;color:#7D1A1A}
.logo{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;background:#fff;border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:contain}
.pos{width:22px;font-weight:700;color:var(--steel);text-align:center}
.ced{border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.ced .ln{display:grid;grid-template-columns:34px 36px 1fr 110px;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line)}
.ced .ln:last-child{border-bottom:0}
.ced .ln.own{background:#FFF6F6}
.ced .ln input{text-align:right;font-size:16px;font-weight:600;padding:6px 8px}
.ced .ln .nm{font-weight:600;line-height:1.2}
.ced .ln .nm small{display:block;font-weight:400;color:var(--steel);font-size:11.5px}
.ced .ln.ex{background:#FAFBFC}
.total{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--grayb);border-radius:8px;margin-top:10px;font-weight:600}
.total.bad{background:var(--redbg);color:var(--red)}
.res{display:grid;grid-template-columns:22px 30px minmax(0,1fr) 34% 58px 56px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.res.own .nm{color:var(--red);font-weight:700}
.res .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .bar{margin:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.mc{height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;border:1px solid transparent;position:relative}
.mc.c0{background:#fff;border:1px dashed #B8C2CC;color:var(--gray)}
.mc.c1{background:var(--amberbg);color:var(--amber);border-color:#EACB94}
.mc.c2{background:var(--green);color:#fff}
.mc.c3{background:var(--red);color:#fff}
.mc .st{position:absolute;top:-6px;right:-5px;font-size:11px;color:#D39B00}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--steel);margin-top:10px}
.lg span{display:flex;align-items:center;gap:5px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.loc{margin-bottom:14px}.loc h3{font-size:13px;margin:0 0 6px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:12.5px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);font-size:13px}.chk input{width:auto}
pre.wa{white-space:pre-wrap;background:#F0F7F1;border:1px solid #CDE3D2;border-radius:8px;padding:14px;font-family:inherit;font-size:13px;max-height:520px;overflow:auto;margin:0}
.lock{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:50}
.lock .card{width:320px;text-align:center}
.modal{position:fixed;inset:0;background:#1C273399;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .card{width:min(720px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13px}
.ci{display:flex;align-items:center;gap:8px}
.hide{display:none!important}
#printArea{display:none}
@media print{body{background:#fff}.app,.toast,.modal{display:none!important}#printArea{display:block;padding:10mm;font-size:12px}#printArea .card{border:0;padding:0}#printArea td,#printArea th{padding:3px 6px;font-size:10.5px}}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}aside{position:sticky;top:0;z-index:5;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px}aside button{white-space:nowrap;flex-shrink:0}aside .bk{display:none}aside .grp,.brand{display:none}aside button{width:auto;padding:7px 10px}main{padding:12px}.g2{grid-template-columns:minmax(0,1fr)}aside{align-items:center;max-height:60px}.card{overflow-x:auto}.top{display:block;margin-bottom:12px}.top h1{font-size:19px}.top p{font-size:12px}.top .row{margin-top:4px}.stamp{text-align:left;font-size:11px}.stamp br{display:none}.stamp .op::before{content:" · "}.app{align-content:start}.card{padding:12px}.kpi .v{font-size:21px}th,td{padding:7px 6px}.res{grid-template-columns:22px 30px minmax(0,1fr) 50px 50px}.res .bar{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Tema profesional ===== */
:root{--ink:#0E1A2B;--steel:#5E6B7D;--paper:#F3F5F8;--line:#E3E8EF;--red:#C8102E;--blue:#1F4E79;--bluebg:#EAF1F8}
body{background:var(--paper)}
aside{background:linear-gradient(180deg,#0E1A2B 0%,#13233A 100%);padding:16px 10px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand img{width:38px;height:38px;border-radius:8px;background:#fff;padding:2px}
.brand b{font-size:15px;line-height:1.2}.brand span{font-size:11px}
aside button{border-radius:8px;position:relative;padding:8px 12px;font-size:13px;color:#B9C6D4}
aside button:hover{background:rgba(255,255,255,.06);color:#fff}
aside button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
aside button.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--red)}
aside .grp{text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:#6F8196;margin:16px 12px 6px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.topbar .tl{display:flex;align-items:center;gap:14px;min-width:0}
.topbar img{height:34px}
.topbar .tt{font-size:13px;line-height:1.3;color:var(--steel);border-left:1px solid var(--line);padding-left:14px}
.topbar .tt b{display:block;color:var(--ink);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--grayb);color:var(--ink);white-space:nowrap;border:1px solid var(--line)}
.chip.red{background:#FDECEE;color:var(--red);border-color:#F6C9D0}.chip.amber{background:var(--amberbg);color:var(--amber);border-color:#EED7A8}.chip.green{background:var(--greenbg);color:var(--green);border-color:#BFE0CB}
.top h1{font-size:24px;letter-spacing:-.01em}
.card{border-radius:12px;border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h2{font-size:14.5px;letter-spacing:-.005em}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--blue);opacity:.85}
.grid>.kpi:nth-child(2)::after{background:var(--green)}.grid>.kpi:nth-child(3)::after{background:var(--red)}.grid>.kpi:nth-child(4)::after{background:#C9A227}.grid>.kpi:nth-child(5)::after{background:#6B7A8F}
.kpi .l{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:600}
.kpi .v{font-size:28px;letter-spacing:-.02em}
th{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;background:#F7F9FB}
tr:hover td{background:#FAFBFD}
.btn{border-radius:8px}.btn.p{background:var(--ink);border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
input,select,textarea{border-radius:8px;border-color:#D3DAE3}
.bkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FDECEE;border:1px solid #F6C9D0;color:#7A1020;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
@media(max-width:760px){.topbar{padding:8px 10px;margin-bottom:12px}.topbar .tt{display:none}.topbar img{height:26px}.chip{font-size:10.5px;padding:3px 8px}aside .brand{display:none}aside button.on::before{display:none}aside button.on{background:#fff;color:var(--ink)}}
@media print{.topbar,.bkbar{display:none}body{background:#fff}#printArea th{background:#F2F4F7}}

</style>

  let row,err;
  if(a.dbId){({data:row,error:err}=await sbClient.from("actas").update(payload).eq("id",a.dbId).select().single())}
  else {({data:row,error:err}=await sbClient.from("actas").insert(payload).select().single())}
  if(err)throw err;a.dbId=row.id;
  const orgs=S.parties.map(p=>({acta_id:row.id,organizacion_id:DB_ORG_BY_CODE[p.id]?.id||null,tipo_voto:"organizacion",votos:Number(a.votes[p.id]||0),digitacion_1:Number(a.votes[p.id]||0)})).filter(x=>x.organizacion_id);
  const {data:prev,error:pe}=await sbClient.from("acta_votos").select("id,organizacion_id").eq("acta_id",row.id);if(pe)throw pe;
  const byOrg={};(prev||[]).forEach(v=>{if(v.organizacion_id&&!byOrg[v.organizacion_id])byOrg[v.organizacion_id]=v.id});
  const keep=new Set(),ins=[];
  for(const o of orgs){const id=byOrg[o.organizacion_id];if(id){keep.add(id);const {error}=await sbClient.from("acta_votos").update(o).eq("id",id);if(error)throw error}else ins.push(o)}
  if(ins.length){const {error}=await sbClient.from("acta_votos").insert(ins);if(error)throw error}
  const stale=(prev||[]).map(v=>v.id).filter(id=>!keep.has(id));
  if(stale.length){const {error}=await sbClient.from("acta_votos").delete().in("id",stale);if(error)throw error}
}

/* ---------- seats: cifra repartidora + mitad más uno ---------- */
function dhondt(v,seats){const r=v.map(()=>0);if(seats<=0)return r;const q=[];v.forEach((x,i)=>{for(let d=1;d<=seats;d++)q.push({i,q:x/d})});q.sort((a,b)=>b.q-a.q);q.slice(0,seats).forEach(o=>{if(o.q>0)r[o.i]++});return r}
function seatsCalc(votes){const S_=+S.cfg.regidores||0;if(!votes.some(x=>x>0))return votes.map(()=>0);const w=votes.indexOf(Math.max(...votes));const d=dhondt(votes,S_);const need=Math.floor(S_/2)+1;if(d[w]>=need)return d;const res=votes.map(()=>0);res[w]=need;const others=votes.map((x,i)=>i===w?0:x);const d2=dhondt(others,S_-need);d2.forEach((x,i)=>{if(i!==w)res[i]=x});return res}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return(x>>>0).toString(16).toUpperCase().padStart(8,"0")}
const Z={90:1.645,95:1.96,99:2.576};
function allocate(n){const N=S.mesas.length;const L=S.locales;let base=L.map(l=>Math.max(1,Math.floor(n*l.mesas/N)));let rem=L.map((l,i)=>n*l.mesas/N-Math.floor(n*l.mesas/N));let s=base.reduce((a,b)=>a+b,0);const ord=rem.map((r,i)=>[r,i]).sort((a,b)=>b[0]-a[0]);let k=0;while(s<n&&k<200){const i=ord[k%ord.length][1];if(base[i]<L[i].mesas){base[i]++;s++}k++}while(s>n){const i=base.indexOf(Math.max(...base));base[i]--;s--}return base.map((b,i)=>Math.min(b,L[i].mesas))}
function sizeFor(E,conf,sig){const N=S.mesas.length,z=Z[conf];const n0=Math.pow(z*sig/E,2);return Math.ceil(n0/(1+n0/N))}
function quick(){
 const M=S.muestra;if(!M)return null;const z=Z[M.conf||95];
 const rep=M.mesas.filter(id=>S.actas[id]&&S.actas[id].estado==="Contabilizada");
 const strata={};S.locales.forEach(l=>strata[l.id]={M:l.mesas,list:[]});rep.forEach(id=>strata[mesa(id).localId].list.push(S.actas[id]));
 const ps=P();let V=0;const Y={};ps.forEach(p=>Y[p.id]=0);
 Object.values(strata).forEach(s=>{if(!s.list.length)return;const w=s.M/s.list.length;s.list.forEach(a=>{V+=w*valid(a);ps.forEach(p=>Y[p.id]+=w*(+a.votes[p.id]||0))})});
 const out={rep:rep.length,n:M.mesas.length,rows:[],missingStrata:Object.entries(strata).filter(([k,s])=>!s.list.length&&M.mesas.some(id=>mesa(id).localId===k)).length};
 if(!V){return out}
 ps.forEach(p=>{const pr=Y[p.id]/V;let pooled=[];Object.values(strata).forEach(s=>s.list.forEach(a=>pooled.push((+a.votes[p.id]||0)-pr*valid(a))));const pm=pooled.reduce((a,b)=>a+b,0)/Math.max(1,pooled.length);const ps2=pooled.length>1?pooled.reduce((a,b)=>a+(b-pm)**2,0)/(pooled.length-1):0;let v=0;Object.values(strata).forEach(s=>{const r=s.list.length;if(!r)return;let s2;if(r>=2){const e=s.list.map(a=>(+a.votes[p.id]||0)-pr*valid(a));const m=e.reduce((a,b)=>a+b,0)/r;s2=e.reduce((a,b)=>a+(b-m)**2,0)/(r-1)}else s2=ps2;v+=s.M*s.M*(1-r/s.M)*s2/r});const moe=z*Math.sqrt(v)/V;out.rows.push({p,pr,moe,lo:Math.max(0,pr-moe),hi:Math.min(1,pr+moe)})});
 out.rows.sort((a,b)=>b.pr-a.pr);
 if(out.rows.length>1){const a=out.rows[0],b=out.rows[1];out.tie=a.lo<=b.hi}
 out.final=out.rep>=Math.ceil(0.8*out.n);return out
}

 const now=Date.now(),ci=cierreTs();

 <div style="border:1px solid #C9D1DA;border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:11px"><b>Definición del 1.º lugar: ${h(st.t)}.</b> ${h(st.d)}</div>
 <div style="font-weight:700;margin:6px 0">Avance por colegio</div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${S.locales.map(l=>{const ms=S.mesas.filter(m=>m.localId===l.id);const r=ms.filter(m=>S.actas[m.id]).length;const f=r/ms.length;const col=f>=.8?"#2E7D4F":f>=.5?"#B7791F":"#C62828";const num=m=>mnum(m)+(inSample(m.id)?"★":"");const pend=ms.filter(m=>!S.actas[m.id]).map(num);const ob=ms.filter(m=>S.actas[m.id]&&S.actas[m.id].estado!=="Contabilizada").map(num);return `<div style="border:1px solid #C9D1DA;border-left:4px solid ${col};border-radius:4px;padding:6px 8px;break-inside:avoid"><div style="font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.n}. ${h(l.name)}</div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:17px;font-weight:700">${r}/${ms.length}</span><span style="font-weight:700;color:${col}">${pc(f,0)}</span></div><div style="height:5px;background:#EEF1F4;border-radius:3px;margin:2px 0 4px"><div style="height:5px;width:${f*100}%;background:${col};border-radius:3px"></div></div>${!pend.length&&!ob.length?'<div style="font-size:9.5px;color:#2E7D4F;font-weight:700">Colegio completo</div>':""}${pend.length?`<div style="font-size:9.5px"><b style="color:#C62828">Sin reporte:</b> ${pend.join(", ")}</div>`:""}${ob.length?`<div style="font-size:9.5px"><b style="color:#B7791F">Observadas:</b> ${ob.join(", ")}</div>`:""}</div>`}).join("")}</div>
 <div style="font-size:9.5px;color:#5B6B7C;margin-top:4px">Números de mesa dentro de cada colegio. ★ = mesa de muestra del conteo rápido (prioridad).</div>
 <div style="font-weight:700;margin:10px 0 4px">Reporte por responsable</div><table><tr><th>Responsable</th><th class="r">Personeros asignados</th><th class="r">Reportaron</th><th class="r">Faltan</th><th class="r">%</th></tr>${S.resp.map(r=>{const ps=S.personeros.filter(p=>p.resp===r.id&&p.mesaId);const rp=ps.filter(p=>S.actas[p.mesaId]).length;return `<tr><td>${h(r.nombre)}</td><td class="r">${ps.length}</td><td class="r"><b>${rp}</b></td><td class="r">${ps.length-rp}</td><td class="r">${ps.length?pc(rp/ps.length,0):"—"}</td></tr>`}).join("")}</table>`;window.print()}

const presente=p=>p.asis&&p.asis.e==="P";
function asisStats(){const asg=S.personeros.filter(p=>p.mesaId);const pr=asg.filter(presente);const cub=S.mesas.filter(m=>{const p=persOf(m.id);return p&&presente(p)}).length;return{asg:asg.length,pr:pr.length,aus:S.personeros.filter(p=>p.asis&&p.asis.e==="A").length,cub}}
function marcar(pid,e){const p=S.personeros.find(x=>x.id===pid);if(!p)return;p.asis=e?{e,t:Date.now()}:null;log(e==="P"?"Asistencia":"Inasistencia",p.nombre+" · "+mlabel(p.mesaId));save();render();const i=$("aQ");if(i)i.focus()}
function quickAsis(){const v=$("aQ").value.trim().toLowerCase();if(!v)return;const list=S.personeros.filter(p=>p.dni===v||p.nombre.toLowerCase().includes(v));if(list.length===1){const p=list[0];marcar(p.id,"P");toast(`${p.nombre} presente · ${p.mesaId?mlabel(p.mesaId):"sin mesa"}`)}else{$("aMsg").innerHTML=list.length?`<div class="warn">${list.length} coincidencias: escribe el DNI o más letras del nombre.</div>`:'<div class="alert">No se encontró ese personero.</div>'}}
function reemplazar(pid){const p=S.personeros.find(x=>x.id===pid);const res=S.personeros.filter(x=>!x.mesaId&&!x.mesaPrev&&x.id!==pid);modal(`<h2>Reemplazar a ${h(p.nombre)}</h2><p class="muted">${h(mlabel(p.mesaId))} · ${h(loc(mesa(p.mesaId).localId).name)}. El reemplazo queda asignado y marcado presente; ${h(p.nombre)} queda como ausente.</p>${res.length?`<select id="rSel">${res.map(r=>`<option value="${r.id}">${h(r.nombre)} · ${h(r.tipo)} · ${h(respName(r.resp))}</option>`).join("")}</select><div class="row" style="margin-top:12px"><button class="btn p" onclick="doReemp('${pid}')">Reemplazar</button><button class="btn" onclick="closeM()">Cancelar</button></div>`:'<div class="warn">No hay personeros sin mesa (reservas). Agrega uno en Personeros.</div><button class="btn" style="margin-top:10px" onclick="closeM()">Cerrar</button>'}`)}
function doReemp(pid){const p=S.personeros.find(x=>x.id===pid),r=S.personeros.find(x=>x.id===$("rSel").value);r.mesaId=p.mesaId;r.asis={e:"P",t:Date.now()};p.mesaPrev=p.mesaId;p.mesaId="";p.asis={e:"A",t:Date.now()};log("Reemplazo",`${p.nombre} → ${r.nombre} · ${mlabel(r.mesaId)}`);closeM();save();render()}
function asisText(){const a=asisStats();const L=[`*ASISTENCIA DE PERSONEROS* · Sunampe ERM 2026`,`🕒 ${dt(Date.now())}`,"🔒 Uso interno",``,`Presentes: ${a.pr}/${a.asg} asignados (${pc(a.asg?a.pr/a.asg:0,0)})`,`Mesas cubiertas: ${a.cub}/${S.mesas.length}`,`Puntuales (hasta ${S.cfg.horaLlegada||"07:00"}): ${asisRows().filter(x=>x.e.k==="ok").length} · Tardanzas: ${asisRows().filter(x=>x.e.k==="tar").length}`,``,`*Por local*`];
 S.locales.forEach(l=>{const ms=S.mesas.filter(m=>m.localId===l.id);const c=ms.filter(m=>{const p=persOf(m.id);return p&&presente(p)}).length;L.push(`${c/ms.length>=.8?"🟢":c/ms.length>=.5?"🟡":"🔴"} ${l.name}: ${c}/${ms.length}`)});
 L.push("","*Por responsable (presentes / meta)*");S.resp.forEach(r=>{const ps=S.personeros.filter(p=>p.resp===r.id);L.push(`${ps.filter(presente).length>=r.meta?"✅":"⏳"} ${r.nombre}: ${ps.filter(presente).length}/${r.meta}`)});
 const falt=S.personeros.filter(p=>p.mesaId&&!presente(p));if(falt.length){L.push("","*Faltan confirmar*");falt.slice(0,25).forEach(p=>L.push(`• ${p.nombre} · ${mlabel(p.mesaId)} · ${respName(p.resp)}`))}return L.join("\n")}

function fillPM(){const l=$("pL").value;$("pM").innerHTML=l?`<option value="">— Sin mesa —</option>`+S.mesas.filter(m=>m.localId===l).map(m=>`<option value="${m.id}" ${persOf(m.id)?"disabled":""}>Mesa ${h(m.code)}${inSample(m.id)?" ★":""}${persOf(m.id)?" (ocupada)":""}</option>`).join(""):`<option value="">— Elige colegio —</option>`}
function aMesaInfo(){const m=$("aM").value;const p=m&&persOf(m);$("aInfo").innerHTML=!m?"—":p?`<b style="color:var(--ink)">${h(p.nombre)}</b>&nbsp;· ${presente(p)?'<span class="b ok">Presente '+hm(p.asis.t)+'</span>':'<span class="b pen">Por confirmar</span>'}`:'<span class="b nd">Sin personero asignado</span>'}
function aMarcar(){const m=$("aM")&&$("aM").value;const p=m&&persOf(m);if(!p){toast(m?"Esa mesa no tiene personero asignado":"Elige colegio y mesa");return}marcar(p.id,"P");toast(`${p.nombre} presente · Mesa ${mesa(m).code}`)}

/* ---------- reporte de asistencia por horario ---------- */
function limTs(){const [H,M]=(S.cfg.horaLlegada||"07:00").split(":");const d=new Date();d.setHours(+H,+M,0,0);return d}
function asisEstado(p){if(!p)return{k:"na",t:"Sin personero",c:"nd"};if(p.asis&&p.asis.e==="A")return{k:"aus",t:"Ausente",c:"obs"};if(!presente(p))return{k:"sr",t:"Sin registro",c:"pen"};const d=new Date(p.asis.t),l=limTs();const min=d.getHours()*60+d.getMinutes()-(l.getHours()*60+l.getMinutes());return min<=0?{k:"ok",t:"Puntual",c:"ok"}:{k:"tar",t:`Tardanza ${min>=60?Math.floor(min/60)+" h "+(min%60)+" min":min+" min"}`,c:"pen",min}}
function asisRows(){return S.mesas.map(m=>{const p=persOf(m.id);return{m,l:loc(m.localId),p,e:asisEstado(p)}})}
function franja(t){const d=new Date(t);const m=d.getHours()*60+d.getMinutes();const b=Math.floor(m/30)*30;const f=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");return f(b)+"–"+f(b+30)}
function asisResumen(){const all=asisRows();return S.locales.map(l=>{const r=all.filter(x=>x.l.id===l.id);const pres=r.filter(x=>x.p&&presente(x.p));const ts=pres.map(x=>x.p.asis.t).sort((a,b)=>a-b);return{l,n:r.length,asg:r.filter(x=>x.p).length,pres:pres.length,punt:r.filter(x=>x.e.k==="ok").length,tar:r.filter(x=>x.e.k==="tar").length,aus:r.filter(x=>x.e.k==="aus").length,sr:r.filter(x=>x.e.k==="sr").length,first:ts[0],last:ts[ts.length-1]}})}

let WC={k:null,r:null};
function winAnalysis(sims){
 sims=sims||3000;const ps=P();const C=counted();const key=(S.rev||0)+"|"+C.length+"|"+sims;if(WC.k===key)return WC.r;
 const done=new Set(C.map(a=>a.mesaId));const rem=S.mesas.filter(m=>!done.has(m.id));const T=totals(C);
 const R=rem.reduce((s,m)=>s+m.elect,0);const eC=S.mesas.filter(m=>done.has(m.id)).reduce((s,m)=>s+m.elect,0);
 const ratio=eC?T.v/eC:0;const expV=Math.round(R*ratio);
 const ord=ps.map((p,i)=>({p,i,v:T.t[p.id]})).sort((a,b)=>b.v-a.v);const lead=ord[0],sec=ord[1];const L=lead.v-sec.v;
 const out={n:C.length,N:S.mesas.length,rem:rem.length,R,expV,L,lead,sec,ord,T,decided:C.length>0&&L>R,rows:[]};
 ord.forEach((o,k)=>{const gap=lead.v-o.v;out.rows.push({...o,max:o.v+R,elim:k>0&&o.v+R<lead.v,gap,need:k>0&&expV?gap/expV:null})});
 const locs=S.locales.map(l=>l.id);const pool={};locs.forEach(id=>pool[id]=C.filter(a=>mesa(a.mesaId).localId===id));
 const byLocRem={};locs.forEach(id=>byLocRem[id]=rem.filter(m=>m.localId===id));
 out.cover=locs.filter(id=>pool[id].length).length;
 if(C.length<8||!rem.length){out.mc=null;if(!rem.length&&C.length){out.mc={final:true}}WC={k:key,r:out};return out}
 const wins=ps.map(()=>0),keep=[0],share=ps.map(()=>[]);const own=ps.findIndex(p=>p.id===S.cfg.own);const seatD={};let aheadOf2=0;
 for(let s=0;s<sims;s++){const tot=ps.map(p=>T.t[p.id]);
  locs.forEach(id=>{const rm=byLocRem[id];if(!rm.length)return;const base=pool[id].length>=2?pool[id]:C;const n=base.length;const boot=[];for(let i=0;i<n;i++)boot.push(base[Math.floor(Math.random()*n)]);
   rm.forEach(m=>{const src=boot[Math.floor(Math.random()*n)];const sc=m.elect/mesa(src.mesaId).elect;ps.forEach((p,j)=>tot[j]+=(+src.votes[p.id]||0)*sc)})});
  let w=0;tot.forEach((x,j)=>{if(x>tot[w])w=j});wins[w]++;if(tot[lead.i]>tot[sec.i])aheadOf2++;const sv=tot.reduce((a,b)=>a+b,0);tot.forEach((x,j)=>share[j].push(x/sv));
  const st=seatsCalc(tot)[own];seatD[st]=(seatD[st]||0)+1}
 const q=(a,f)=>{a.sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor(f*a.length))]};
 out.mc={sims,aheadOf2:aheadOf2/sims,seatD:Object.entries(seatD).map(([k,v])=>({k:+k,p:v/sims})).sort((a,b)=>a.k-b.k)};
 out.rows.forEach(r=>{r.pw=wins[r.i]/sims;const a=share[r.i];r.mean=a.reduce((x,y)=>x+y,0)/a.length;r.lo=q(a,.05);r.hi=q(a,.95)});
 WC={k:key,r:out};return out}
function winStatus(w){if(!w.n)return{c:"nd",t:"Sin datos",d:"Aún no hay actas contabilizadas."};
 if(!w.rem)return{c:"ok",t:"Cómputo completo",d:`Todas las mesas están contabilizadas. ${w.lead.p.name} obtiene el primer lugar.`};
 if(w.decided)return{c:"ok",t:"Límite matemático",d:`La ventaja de ${nf(w.L)} votos supera a los ${nf(w.R)} electores de las mesas que faltan. Aunque todos votaran por el segundo lugar, ${w.lead.p.name} no puede ser alcanzado.`};
 if(!w.mc)return{c:"nd",t:"Datos insuficientes",d:`Se necesitan al menos 8 actas contabilizadas para estimar probabilidades (van ${w.n}).`};
 const p=w.mc.aheadOf2;const full=w.cover===S.locales.length&&w.n>=Math.ceil(.3*w.N);if(p>=.99&&!full)return{c:"inf",t:"Intervalo informativo",d:`${w.lead.p.name} se mantiene adelante en ${pc(p,1)} de las simulaciones, pero aún faltan locales sin datos o hay menos del 30% de actas: se espera antes de declararlo ganador estadístico.`};if(p>=.99)return{c:"ok",t:"Escenario estadístico",d:`${w.lead.p.name} mantiene el primer lugar en más del 99% de las simulaciones. Remontar es matemáticamente posible pero estadísticamente muy improbable.`};
 if(p>=.9)return{c:"inf",t:"Intervalo informativo",d:`${w.lead.p.name} gana en ${pc(p,0)} de las simulaciones. Todavía existe posibilidad de remontada.`};
 return{c:"pen",t:"Datos aún abiertos",d:`El primer lugar no está definido: ${w.lead.p.name} solo se mantiene adelante en ${pc(p,0)} de las simulaciones.`}}

 return hdr("Escenarios estadísticos",`${w.n} de ${w.N} actas contabilizadas · se recalcula con cada acta`)+`

 <div class="card" style="margin-top:14px"><h2>Análisis por organización</h2><div class="tw"><table><tr><th></th><th>Organización</th><th class="r">Votos</th><th class="r">% actual</th><th class="r">Proyección final</th><th>Rango 90%</th><th class="r">Prob. de ganar</th><th class="r">Máximo posible</th><th>Para superar al 1.º</th></tr>
 ${w.n?w.rows.map((r,k)=>`<tr ${r.p.id===own?'style="background:#FFF6F6"':""}><td>${logoH(r.p)}</td><td><b>${h(r.p.name)}</b></td><td class="r">${nf(r.v)}</td><td class="r">${pc(w.T.v?r.v/w.T.v:0)}</td><td class="r"><b>${r.mean!=null?pc(r.mean):"—"}</b></td><td>${r.lo!=null?pc(r.lo)+" – "+pc(r.hi):"—"}</td><td class="r"><b>${r.pw!=null?(r.pw<.001?"<0.1%":r.pw>.999?">99.9%":pc(r.pw)):(w.decided?(k===0?"100%":"0%"):"—")}</b></td><td class="r">${nf(r.max)}</td><td>${k===0?'<span class="b ok">Líder</span>':r.elim?'<span class="b obs">Eliminado matemáticamente</span>':r.need!=null?(r.need>1?'<span class="b obs">Imposible en la práctica</span>':`Debe sacarle <b>${(r.need*100).toFixed(1)} pts</b> al líder en lo que falta`):"—"}</td></tr>`).join(""):'<tr><td colspan="9" class="muted">Sin actas contabilizadas.</td></tr>'}</table></div>

 <table><tr><th></th><th>Organización</th><th class="r">% estimado</th><th class="r">Margen</th><th>Intervalo de confianza ${M.conf}%</th></tr>${q.rows.map(r=>`<tr ${r.p.id===S.cfg.own?'style="background:#FFF6F6"':""}><td>${logoH(r.p)}</td><td><b>${h(r.p.name)}</b></td><td class="r"><b>${pc(r.pr)}</b></td><td class="r">± ${(r.moe*100).toFixed(1)}</td><td style="min-width:170px"><div style="position:relative;height:14px;background:var(--grayb);border-radius:3px"><div style="position:absolute;left:${r.lo*100/Math.max(.5,q.rows[0].hi)}%;width:${(r.hi-r.lo)*100/Math.max(.5,q.rows[0].hi)}%;top:3px;height:8px;background:${r.p.color};border-radius:3px;opacity:.8"></div></div><div class="muted">${pc(r.lo)} – ${pc(r.hi)}</div></td></tr>`).join("")}</table>`}
 ${M?`<div class="note" style="margin-top:12px"><b>Ficha técnica.</b> Universo: ${S.mesas.length} mesas y ${nf(S.locales.reduce((s,l)=>s+l.elect,0))} electores hábiles (ONPE, ficha técnica ERM 2026 v06, 16/07/2026). Muestra: ${M.mesas.length} mesas, aleatoria estratificada por local de votación con asignación proporcional. Estimador de razón con ponderación por estrato y corrección por población finita. Confianza: ${M.conf}%. Muestra sellada el ${dt(M.ts)}, código ${M.code}. Uso interno.</div>`:""}
 </div>
 <div class="grid" style="align-content:start">
 <div class="card f"><h2>Tamaño de muestra recomendado</h2><div class="grid g2"><div><label>Confianza</label><select onchange="filt.conf=this.value;render()">${[90,95,99].map(c=>`<option ${conf===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>Variación entre mesas</label><select onchange="filt.sig=this.value;render()">${[[.05,"Baja (5 pts)"],[.08,"Media (8 pts)"],[.12,"Alta (12 pts)"]].map(([v,t])=>`<option value="${v}" ${sig===v?"selected":""}>${t}</option>`).join("")}</select></div></div>
 <table><tr><th>Margen buscado</th><th class="r">Mesas necesarias</th></tr>${[2,3,4,5].map(e=>`<tr><td>± ${e} pts</td><td class="r"><b>${sizeFor(e/100,conf,sig)}</b> de ${S.mesas.length}</td></tr>`).join("")}</table>
 <p class="muted">La variación entre mesas indica cuánto cambia el voto de una mesa a otra. Con el simulacro puedes afinarla.</p></div>
 <div class="card f"><h2>Muestra</h2>${M?`<div><span class="b ok">Sellada</span> <b>${M.mesas.length} mesas</b> · código <b>${M.code}</b><div class="muted">Generada el ${dt(M.ts)} por ${h(M.user)} · semilla ${M.seed}</div></div>
 <table><tr><th>Local</th><th class="r">Mesas</th><th>Muestra</th></tr>${S.locales.map(l=>{const ms=M.mesas.filter(id=>mesa(id).localId===l.id);return `<tr><td>${h(l.name)}</td><td class="r">${l.mesas}</td><td>${ms.map(id=>`<span class="b ${S.actas[id]?"ok":"nd"}">${h(mesa(id).code)}</span>`).join(" ")}</td></tr>`}).join("")}</table>
 <button class="btn d" onclick="resetMuestra()">Anular y regenerar muestra</button>`:`
 <div class="grid g2"><div><label>Tamaño (mesas)</label><input type="number" id="mN" value="${sizeFor(.04,conf,sig)}" min="9" max="${S.mesas.length}"></div><div><label>Confianza</label><select id="mC">${[90,95,99].map(c=>`<option ${c===95?"selected":""}>${c}</option>`).join("")}</select></div></div>
 <p class="muted">Se reparte por local en proporción a sus mesas (al menos una por local) y se sella con fecha, hora y código. Genérala antes del día de la elección.</p><button class="btn p" onclick="genMuestra()">Generar y sellar muestra</button>`}</div></div></div>`};
function genMuestra(){const n=Math.min(S.mesas.length,Math.max(S.locales.length,+$("mN").value||18));const seed=Date.now()%2147483647;const rnd=mulberry(seed);const al=allocate(n);const ids=[];S.locales.forEach((l,i)=>{const ms=S.mesas.filter(m=>m.localId===l.id).map(m=>m.id);for(let k=ms.length-1;k>0;k--){const j=Math.floor(rnd()*(k+1));[ms[k],ms[j]]=[ms[j],ms[k]]}ids.push(...ms.slice(0,al[i]))});S.muestra={seed,ts:Date.now(),mesas:ids,conf:+$("mC").value,user:S.cfg.op,code:hash(seed+"|"+ids.join(","))};log("Muestra sellada",`${ids.length} mesas · código ${S.muestra.code}`);save();render()}
function resetMuestra(){const t=prompt("Anular la muestra afecta la validez del conteo rápido. Escribe ANULAR para confirmar.");if(t!=="ANULAR")return;log("Muestra anulada","Código "+S.muestra.code);S.muestra=null;save();render()}

function waText(c,dest,cierre){const ps=P();const prev=S.cortes.find(x=>x.n===c.n-1);const own=S.parties.find(p=>p.id===S.cfg.own);const L=[];
 L.push(`*${cierre?"INFORME DE CIERRE":"CORTE N.º "+c.n}* · Sunampe ERM 2026`);L.push(`🕒 ${dt(c.t)}`);if(c.sim)L.push("⚠️ SIMULACRO · datos de prueba");L.push("🔒 Uso interno · no difundir");L.push("");
 L.push(`*Avance*`);L.push(`Actas recibidas: ${c.rec}/${c.N} (${pc(c.rec/c.N)})`);L.push(`Contabilizadas: ${c.cnt}/${c.N} (${pc(c.cnt/c.N)})${prev?` · +${c.cnt-prev.cnt} desde las ${hm(prev.t)}`:""}`);L.push(`Observadas: ${c.obs} · Pendientes: ${c.pen}`);L.push(`Participación: ${pc(c.part)}`);L.push("");
 if(c.T.v){L.push(`*Resultados parciales* (actas contabilizadas)`);ps.map(p=>({p,v:c.T.t[p.id]})).sort((a,b)=>b.v-a.v).slice(0,cierre?9:5).forEach((x,i)=>L.push(`${i+1}. ${x.p.id===S.cfg.own?"*"+x.p.sigla+"*":x.p.sigla} ${pc(x.v/c.T.v)} (${nf(x.v)})`));L.push("")}
 if(c.q){L.push(`*Conteo rápido* ${c.q.final?"":"(preliminar)"} · ${c.q.rep}/${c.q.n} mesas de muestra`);c.q.rows.slice(0,3).forEach(r=>{const p=S.parties.find(x=>x.id===r.id);L.push(`• ${p.sigla} ${pc(r.pr)} ± ${(r.moe*100).toFixed(1)}`)});if(c.q.tie)L.push("⚖️ Empate técnico entre los dos primeros");L.push("_Proyección estadística, no es resultado oficial._");L.push("")}
 const oi=ps.findIndex(p=>p.id===S.cfg.own);if(c.T.v){const pos=ps.map(p=>c.T.t[p.id]).sort((a,b)=>b-a).indexOf(c.T.t[own.id])+1;L.push(`*${own.name}*: ${pos}º lugar · ${pc(c.T.t[own.id]/c.T.v)} · regidores proyectados: ${c.seats[oi]}`);L.push("")}
 if(c.win){L.push(`*Definición del 1.º lugar*: ${c.win.st}`);L.push(`${c.win.lead} aventaja a ${c.win.sec} por ${nf(c.win.L)} votos · faltan ${nf(c.win.R)} electores por contar`);if(c.win.p!=null&&c.win.st!=="Límite matemático")L.push(`Probabilidad de que ${c.win.lead} se mantenga: ${c.win.p>.999?">99.9%":pc(c.win.p,1)}`);L.push("")}
 L.push(`*Avance por local*`);c.loc.forEach(x=>L.push(`${x.r/x.t>=.8?"🟢":x.r/x.t>=.5?"🟡":"🔴"} ${x.name}: ${x.r}/${x.t}`));L.push("");
 L.push(`*Personeros*: ${c.pers.asig}/${c.N} mesas cubiertas · ${c.pers.pres??0} presentes en apertura · ${c.pers.rep} reportaron`);
 if(dest&&dest!=="general"){const r=S.resp.find(x=>x.id===dest);const mine=S.personeros.filter(p=>p.resp===dest&&p.mesaId);L.push("");L.push(`*Tus personeros · ${r.nombre}*`);L.push(`Reportaron ${mine.filter(p=>S.actas[p.mesaId]).length} de ${mine.length}`);mine.filter(p=>!S.actas[p.mesaId]).forEach(p=>L.push(`⏳ ${p.nombre} · ${mlabel(p.mesaId)}`))}
 if(c.obs&&(!dest||dest==="general")){L.push("");L.push(`⚠️ ${c.obs} actas observadas en revisión.`)}
 L.push("");L.push(`_Fuente: centro de cómputo de campaña. Universo ONPE: ${S.mesas.length} mesas, ${nf(S.mesas.reduce((a,m)=>a+(+m.elect||0),0))} electores._`);return L.join("\n")}

 <div class="card" style="margin-top:14px"><h2>Colegios, mesas y electores<small>ingreso manual · referencia ONPE ficha técnica v06</small></h2><p class="muted">Escribe el número oficial de cada mesa y sus electores hábiles. La suma se compara con el total del colegio según la ONPE.</p>${S.locales.map(l=>{const ms=S.mesas.filter(m=>m.localId===l.id);const sum=ms.reduce((s,m)=>s+(+m.elect||0),0);const d=sum-l.elect;return `<details style="border-bottom:1px solid var(--line);padding:8px 0" ${filt.cfl===l.id?"open":""} ontoggle="if(this.open)filt.cfl='${l.id}'"><summary style="cursor:pointer"><b>${l.n}. ${h(l.name)}</b> · ${l.mesas} mesas · electores ${nf(sum)} / ${nf(l.elect)} ONPE ${d===0?'<span class="b ok">Cuadra</span>':`<span class="b obs">${d>0?"+":""}${nf(d)}</span>`}</summary>
 <div class="grid g2" style="margin:10px 0"><div><label>Nombre del colegio</label><input value="${h(l.name)}" onchange="setL('${l.id}','name',this.value)"></div><div><label>Dirección</label><input value="${h(l.dir)}" onchange="setL('${l.id}','dir',this.value)"></div><div><label>Total de electores según ONPE</label><input type="number" value="${l.elect}" onchange="setL('${l.id}','elect',+this.value)"></div></div>
 <table><tr><th style="width:50px">N.º</th><th>Número de mesa (ONPE)</th><th>Electores hábiles</th><th>Personero</th><th>Acta</th></tr>${ms.map((m,k)=>`<tr><td>${k+1}</td><td><input value="${h(m.code)}" style="max-width:160px" placeholder="Ej. 045123" onchange="setM('${m.id}','code',this.value.trim())"></td><td><input type="number" min="0" max="300" value="${m.elect}" style="max-width:110px" onchange="setM('${m.id}','elect',+this.value)"></td><td>${persOf(m.id)?h(persOf(m.id).nombre):'<span class="muted">—</span>'}</td><td>${S.actas[m.id]?estB(S.actas[m.id]):'<span class="muted">—</span>'}</td></tr>`).join("")}<tr><th></th><th>Total</th><th>${nf(sum)}</th><th colspan="2">${d===0?"Coincide con la ONPE":`Diferencia con ONPE: ${d>0?"+":""}${nf(d)}`}</th></tr></table></details>`}).join("")}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card f"><h2>Simulacro</h2><p class="muted">Genera actas ficticias para ensayar con el equipo. Mientras esté activo, todos los informes llevan la marca de simulacro.</p>${S.cfg.sim?`<div class="warn">Simulacro activo con ${actasArr().filter(a=>a.sim).length} actas de prueba.</div><button class="btn d" onclick="endSim()">Terminar simulacro y borrar datos de prueba</button>`:`<button class="btn" onclick="startSim()">Iniciar simulacro</button>`}</div>
 ${bkCard()}</div><div class="grid g2" style="margin-top:14px"><div class="card f"><h2>Respaldo manual</h2><p class="muted">Cada corte descarga un respaldo automático. Guárdalo también en una USB. Para fusionar una segunda laptop, importa su respaldo: solo se agregan mesas que no existan aquí.</p><div class="row"><button class="btn p" onclick="exportJSON()">Exportar respaldo completo</button><label class="btn" style="margin:0;color:var(--ink);font-size:13px">Importar y fusionar<input type="file" accept=".json" class="hide" onchange="importJSON(this,false)"></label><label class="btn" style="margin:0;color:var(--ink);font-size:13px">Restaurar completo (incluye PDFs)<input type="file" accept=".json" class="hide" onchange="importJSON(this,true)"></label><button class="btn" onclick="exportCSV()">Exportar actas CSV</button></div><button class="btn d" onclick="wipe()">Borrar todos los datos</button></div></div>`;
function setP(id,k,v){S.parties.find(p=>p.id===id)[k]=v;save()}
function setR(id,k,v){S.resp.find(r=>r.id===id)[k]=v;save()}
function setM(id,k,v){if(k==="code"&&S.mesas.some(m=>m.id!==id&&m.code===v)){toast("Ese número de mesa ya existe");render();return}if(k==="elect"&&(v<0||v>300)){toast("Una mesa tiene entre 0 y 300 electores");render();return}const m=mesa(id);log("Mesa editada",`${m.code} · ${k}: ${m[k]} → ${v}`);m[k]=v;save();render()}
function setL(id,k,v){const l=loc(id);log("Colegio editado",`${l.name} · ${k}: ${l[k]} → ${v}`);l[k]=v;save();render()}
function mnum(m){const c=String(m.code);return /^\d+-\d+$/.test(c)?c.split("-")[1]:c}
function upLogo(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=Math.min(1,128/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);setP(id,"logo",c.toDataURL("image/png"));render()};img.src=r.result};r.readAsDataURL(f)}
function startSim(){if(!confirm("Se generarán actas de prueba para las mesas vacías. ¿Continuar?"))return;S.cfg.sim=true;const ps=P();const base=ps.map((p,i)=>Math.max(.02,[.24,.2,.15,.1,.12,.06,.06,.04,.03][i]||.05));S.mesas.forEach(m=>{if(S.actas[m.id])return;if(Math.random()<.35)return;const turn=.7+Math.random()*.15;const em=Math.round(m.elect*turn);const w=base.map(b=>b*(0.6+Math.random()*.8));const sw=w.reduce((a,b)=>a+b,0);const bl=Math.round(em*.06),nu=Math.round(em*.05);const vv=em-bl-nu;const votes={};let acc=0;ps.forEach((p,i)=>{votes[p.id]=i<ps.length-1?Math.round(vv*w[i]/sw):0;acc+=votes[p.id]});votes[ps[ps.length-1].id]=Math.max(0,vv-acc);const obs=Math.random()<.05;S.actas[m.id]={mesaId:m.id,votes,bl,nu,imp:0,estado:obs?"Observada":"Contabilizada",motivo:obs?"Imagen ilegible":"",obs:"",personero:persOf(m.id)?.nombre||"",hora:Date.now()-Math.random()*3*3600000,user:"Simulacro",sim:true,verif:null,hist:[]}});log("Simulacro iniciado","");save();render()}
function endSim(){if(!confirm("Se borrarán todas las actas de prueba y los cortes del simulacro."))return;Object.keys(S.actas).forEach(k=>{if(S.actas[k].sim)delete S.actas[k]});S.cortes=S.cortes.filter(c=>!c.sim);S.cfg.sim=false;log("Simulacro terminado","");save();render()}
function dl(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const stampF=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}`};
async function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function b64Blob(b64,type){const bin=atob(b64||"");const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:type||"application/pdf"})}
async function exportJSON(){S.cfg.lastBackup=Date.now();save();const pdfs={};for(const a of Object.values(S.actas)){if(a.hasPdf){const f=await idb("pdf","readonly",s=>s.get(a.mesaId));if(f)pdfs[a.mesaId]={type:f.type||"application/pdf",name:f.name||`acta_${a.mesaId}.pdf`,data:await blobB64(f)}}}const pack={format:"sunampe-erm2026-full",version:3,exportedAt:Date.now(),state:S,pdfs};dl(`respaldo_completo_sunampe_${stampF()}.json`,JSON.stringify(pack),"application/json");log("Respaldo completo exportado",`${Object.keys(pdfs).length} PDF(s)`);save();toast(`Respaldo completo creado · ${Object.keys(pdfs).length} PDF(s)`)}
async function backupAuto(){if(BK.dir&&BK.perm&&S.cfg.bkOn){if(await bkWrite("corte"))return}const pdfs={};for(const a of Object.values(S.actas)){if(a.hasPdf){const f=await idb("pdf","readonly",s=>s.get(a.mesaId));if(f)pdfs[a.mesaId]={type:f.type||"application/pdf",name:f.name||`acta_${a.mesaId}.pdf`,data:await blobB64(f)}}}const pack={format:"sunampe-erm2026-full",version:3,exportedAt:Date.now(),state:S,pdfs};dl(`respaldo_corte${S.cortes.length}_${stampF()}.json`,JSON.stringify(pack),"application/json")}
function exportCSV(){const ps=P();const hd=["mesa","local","electores",...ps.map(p=>p.sigla),"blancos","nulos","impugnados","emitidos","estado","motivo","personero","hora"];const rows=S.mesas.filter(m=>S.actas[m.id]).map(m=>{const a=S.actas[m.id];return[m.code,loc(m.localId).name,m.elect,...ps.map(p=>a.votes[p.id]||0),a.bl,a.nu,a.imp,emit(a),a.estado,a.motivo,a.personero,new Date(a.hora).toLocaleString("es-PE")]});dl(`actas_sunampe_${stampF()}.csv`,"\ufeff"+[hd,...rows].map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}
function importJSON(inp,full){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result),pack=d.format==="sunampe-erm2026-full"?d:null,state=pack?pack.state:d;if(!state.mesas||!state.actas)throw 0;if(full){if(!confirm("Esto reemplaza todos los datos actuales por el respaldo. ¿Continuar?"))return;S=state;if(pack&&pack.pdfs){await idb("pdf","readwrite",s=>s.clear());for(const [id,x] of Object.entries(pack.pdfs))await idb("pdf","readwrite",s=>s.put(b64Blob(x.data,x.type),id))}log("Respaldo restaurado",`${f.name}${pack?" · completo con PDFs":""}`)}else{let add=0,conf=0;Object.entries(state.actas).forEach(([k,a])=>{if(!mesa(k))return;if(S.actas[k]){if(JSON.stringify(S.actas[k].votes)!==JSON.stringify(a.votes))conf++}else{S.actas[k]=a;add++}});(state.personeros||[]).forEach(p=>{if(!S.personeros.some(x=>(p.dni&&x.dni===p.dni)||x.id===p.id||(!p.dni&&x.nombre===p.nombre)))S.personeros.push(p)});if(pack&&pack.pdfs)for(const [id,x] of Object.entries(pack.pdfs))if(!S.actas[id]||!S.actas[id].hasPdf)await idb("pdf","readwrite",s=>s.put(b64Blob(x.data,x.type),id));log("Fusión de respaldo",`${add} actas agregadas · ${conf} en conflicto`);toast(`${add} actas agregadas${conf?" · "+conf+" mesas con datos distintos (revisar)":""}`)}save();render()}catch(e){toast("El archivo no es un respaldo válido de este sistema.")}};r.readAsText(f)}

async function wipe(){if(prompt("Escribe BORRAR para eliminar todos los datos de esta laptop.")!=="BORRAR")return;S=fresh();await idb("pdf","readwrite",s=>s.clear());log("Datos borrados","");save();render()}

function prepItems(){const N=S.mesas.length;const cub=S.mesas.filter(m=>persOf(m.id)).length;const sm=S.muestra?S.muestra.mesas:[];const smc=sm.filter(id=>persOf(id)).length;const codes=S.mesas.filter(m=>!/^\d+-\d+$/.test(String(m.code))).length;const cuadra=S.locales.filter(l=>S.mesas.filter(m=>m.localId===l.id).reduce((s,m)=>s+(+m.elect||0),0)===l.elect).length;const logos=S.parties.filter(p=>p.logo).length;const cands=S.parties.filter(p=>p.cand).length;const simDone=S.log.some(l=>l.a==="Simulacro terminado");const lb=S.cfg.lastBackup;
 return[
 ["Número de regidurías confirmado con el JEE",!!S.cfg.regConf,S.cfg.regConf?`${S.cfg.regidores} regidurías`:`Marcar como confirmado en Configuración (actual: ${S.cfg.regidores})`,"config"],
 ["Candidatos a alcaldía registrados",cands===S.parties.length,`${cands} de ${S.parties.length}`,"config"],
 ["Logos de los partidos cargados",logos===S.parties.length,`${logos} de ${S.parties.length}`,"config"],
 ["Números oficiales de mesa (ONPE) ingresados",codes===N,`${codes} de ${N}`,"config"],
 ["Electores por mesa cuadran con la ONPE",cuadra===S.locales.length,`${cuadra} de ${S.locales.length} colegios`,"config"],
 ["Responsables (candidata y regidores) con metas",S.resp.length>1,`${S.resp.length} responsables`,"config"],
 ["Muestra del conteo rápido sellada",!!S.muestra,S.muestra?`${sm.length} mesas · código ${S.muestra.code}`:"Pendiente","conteo"],
 ["Mesas de muestra con personero asignado",!!S.muestra&&smc===sm.length,S.muestra?`${smc} de ${sm.length}`:"Primero sellar la muestra","personeros"],
 ["Todas las mesas con personero",cub===N,`${cub} de ${N}`,"personeros"],
 ["Simulacro realizado con el equipo",simDone,simDone?"Realizado":"Pendiente","config"],
 ["PIN de acceso configurado",!!S.cfg.pin,S.cfg.pin?"Activo":"Sin PIN","config"],
 ["Nombre del operador configurado",S.cfg.op&&S.cfg.op!=="Digitador",h(S.cfg.op),"config"],
 ["Respaldo reciente (últimas 24 h)",!!lb&&Date.now()-lb<864e5,lb?"Último: "+dt(lb):"Nunca","config"]]}
V.preparacion=()=>{const it=prepItems();const ok=it.filter(x=>x[1]).length;const f=ok/it.length;
 return hdr("Lista de preparación","Revisa que todo esté listo antes del 4 de octubre.")+`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${ok} de ${it.length} puntos listos</h2><b style="color:${semC(f)}">${pc(f,0)}</b></div><div class="bar" style="margin:10px 0 14px"><i style="width:${f*100}%;background:${semC(f)}"></i></div>
 <table>${it.map(([t,o,d,pg])=>`<tr><td style="width:28px"><span class="b ${o?"ok":"pen"}">${o?"✓":"!"}</span></td><td><b>${t}</b><div class="muted">${d}</div></td><td class="r">${o?"":`<button class="btn s" onclick="go('${pg}')">Resolver</button>`}</td></tr>`).join("")}</table></div>`};

V.bitacora=()=>hdr("Bitácora","Registro de cada acción realizada en el sistema.")+`<div class="card"><div class="tw"><table><tr><th>Fecha y hora</th><th>Operador</th><th>Acción</th><th>Detalle</th></tr>${S.log.slice(0,400).map(l=>`<tr><td>${dt(l.t)}</td><td>${h(l.u)}</td><td><b>${h(l.a)}</b></td><td class="muted">${h(l.d)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Sin registros.</td></tr>'}</table></div></div>`;

/* ---------- respaldo automático en carpeta ---------- */
const BK={dir:null,perm:false,busy:false,quiet:false};
async function buildBackup(){const pdfs={};for(const a of Object.values(S.actas)){if(a.hasPdf){const f=await idb("pdf","readonly",s=>s.get(a.mesaId));if(f)pdfs[a.mesaId]={type:f.type||"application/pdf",name:f.name||`acta_${a.mesaId}.pdf`,data:await blobB64(f)}}}return{txt:JSON.stringify({format:"sunampe-erm2026-full",version:3,exportedAt:Date.now(),state:S,pdfs}),n:Object.keys(pdfs).length}}
async function bkLoad(){try{BK.dir=await idb("kv","readonly",s=>s.get("bkdir"))||null;if(BK.dir)BK.perm=(await BK.dir.queryPermission({mode:"readwrite"}))==="granted"}catch(e){BK.dir=null}}
async function bkChoose(){if(!window.showDirectoryPicker){toast("Este navegador no permite elegir carpeta. Usa Chrome o Edge en la computadora.");return}try{const d=await showDirectoryPicker({id:"sunampe-respaldos",mode:"readwrite"});await idb("kv","readwrite",s=>s.put(d,"bkdir"));BK.dir=d;BK.perm=true;S.cfg.bkOn=true;S.cfg.bkFolder=d.name;log("Carpeta de respaldo",d.name);save();await bkWrite("inicial");render()}catch(e){if(e.name!=="AbortError")toast("No se pudo usar esa carpeta: "+e.message)}}
async function bkResume(){if(!BK.dir)return;try{BK.perm=(await BK.dir.requestPermission({mode:"readwrite"}))==="granted";if(BK.perm){await bkWrite("reactivado");toast("Respaldo automático reactivado")}}catch(e){toast("No se pudo reactivar: "+e.message)}render()}
function bkForget(){idb("kv","readwrite",s=>s.delete("bkdir"));BK.dir=null;BK.perm=false;S.cfg.bkOn=false;save();render()}
async function bkWrite(reason){if(!BK.dir||!BK.perm||BK.busy)return false;BK.busy=true;try{const {txt,n}=await buildBackup();const name=`respaldo_sunampe_${stampF()}.json`;for(const nm of [name,"respaldo_sunampe_ULTIMO.json"]){const fh=await BK.dir.getFileHandle(nm,{create:true});const w=await fh.createWritable();await w.write(txt);await w.close()}
 const list=[];for await(const [nm] of BK.dir.entries()){if(/^respaldo_sunampe_\d{4}-/.test(nm))list.push(nm)}list.sort();const keep=+S.cfg.bkKeep||48;for(const nm of list.slice(0,Math.max(0,list.length-keep)))try{await BK.dir.removeEntry(nm)}catch(e){}
 BK.quiet=true;S.cfg.lastBackup=Date.now();S.cfg.bkLast=Date.now();S.cfg.bkLastName=name;S.cfg.bkChg=S.chg||0;if(reason!=="auto")log("Respaldo en carpeta",`${name} · ${reason} · ${n} PDF(s)`);save();BK.quiet=false;return true}
 catch(e){if(e.name==="NotAllowedError"){BK.perm=false}toast("Respaldo automático falló: "+e.message);return false}finally{BK.busy=false;if(typeof nav==="function")nav()}}
function bkTick(){if(!S.cfg.bkOn||!BK.perm)return;const iv=(+S.cfg.bkMin||10)*60000;if((S.chg||0)!==(S.cfg.bkChg||0)&&Date.now()-(S.cfg.bkLast||0)>=iv)bkWrite("auto")}
function bkBanner(){return S.cfg.bkOn&&BK.dir&&!BK.perm?`<div class="bkbar"><span><b>Respaldo automático en pausa.</b> El navegador pide confirmar el acceso a la carpeta «${h(S.cfg.bkFolder||BK.dir.name)}» cada vez que se abre el sistema.</span><button class="btn s red" onclick="bkResume()">Reactivar</button></div>`:S.cfg.bkOn===undefined&&!BK.dir&&window.showDirectoryPicker&&page==="panel"?`<div class="bkbar" style="background:var(--bluebg);border-color:#C9DAEC;color:#1F3B57"><span><b>Configura el respaldo automático:</b> elige una carpeta (por ejemplo, una USB) y el sistema guardará copias solo.</span><button class="btn s p" onclick="bkChoose()">Elegir carpeta</button></div>`:""}
function bkCard(){const sup=!!window.showDirectoryPicker;return `<div class="card f"><h2>Respaldo automático en carpeta</h2>${!sup?'<div class="warn">Este navegador no permite escribir en carpetas. En la computadora usa Chrome o Edge. En el celular se mantiene la descarga del respaldo en cada corte.</div>':BK.dir?`<div class="row" style="justify-content:space-between"><div><div class="muted">Carpeta</div><b>📁 ${h(S.cfg.bkFolder||BK.dir.name)}</b></div><span class="b ${BK.perm&&S.cfg.bkOn?"ok":"pen"}">${BK.perm?(S.cfg.bkOn?"Activo":"Pausado"):"Requiere reactivar"}</span></div>
 <div class="grid g2"><div><label>Guardar cada</label><select onchange="S.cfg.bkMin=+this.value;save()">${[5,10,15,30].map(m=>`<option value="${m}" ${(+S.cfg.bkMin||10)===m?"selected":""}>${m} minutos (si hubo cambios)</option>`).join("")}</select></div><div><label>Conservar</label><select onchange="S.cfg.bkKeep=+this.value;save()">${[24,48,96,200].map(m=>`<option value="${m}" ${(+S.cfg.bkKeep||48)===m?"selected":""}>últimas ${m} copias</option>`).join("")}</select></div></div>
 <p class="muted" style="margin:0">Último: ${S.cfg.bkLast?dt(S.cfg.bkLast)+" · "+h(S.cfg.bkLastName||""):"—"}. Además de las copias con fecha, siempre se actualiza <b>respaldo_sunampe_ULTIMO.json</b>. Cada corte también guarda una copia.</p>

/* ---------- gráfico de votos y proyección (panel) ---------- */
function projChart(){const s=statsCore();const ps=P();const q=quick();const w=winAnalysis(1500);const own=S.cfg.own;
 if(!s.T.v)return `<p class="muted">El gráfico aparece con la primera acta contabilizada.</p>`;
 const rows=ps.map(p=>{const qr=q&&q.rows.find(r=>r.p.id===p.id);const wr=w&&w.rows&&w.rows.find(r=>r.p.id===p.id);return{p,act:s.T.t[p.id]/s.T.v,q:qr,w:wr&&wr.mean!=null?wr:null}}).sort((a,b)=>b.act-a.act);
 const mx=Math.min(1,Math.max(.1,...rows.map(r=>Math.max(r.act,r.q?r.q.hi:0,r.w?r.w.hi:0)))*1.12);
 const W=760,L=150,R=70,rh=34,T=24,H=T+rows.length*rh+22;const x=v=>L+v/mx*(W-L-R);let g="";
 for(let t=0;t<=mx+1e-9;t+=mx>.5?.1:.05){g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T-6}" y2="${H-18}" stroke="#E8ECF2"/><text x="${x(t)}" y="${H-4}" font-size="10" fill="#8491A3" text-anchor="middle">${Math.round(t*100)}%</text>`}
 const body=rows.map((r,i)=>{const y=T+i*rh;const o=r.p.id===own;return `<g><text x="0" y="${y+17}" font-size="12.5" font-weight="${o?700:500}" fill="${o?"#C8102E":"#172233"}">${h(r.p.sigla)}</text><text x="44" y="${y+17}" font-size="11" fill="#8491A3">${h(r.p.name.length>16?r.p.name.slice(0,15)+"…":r.p.name)}</text>
 <rect x="${L}" y="${y+6}" width="${Math.max(2,x(r.act)-L)}" height="16" rx="3" fill="${r.p.color}" opacity="${o?1:.85}"/>
 ${r.w?`<line x1="${x(r.w.lo)}" x2="${x(r.w.hi)}" y1="${y+26}" y2="${y+26}" stroke="#172233" stroke-width="1.5" opacity=".55"/><path d="M${x(r.w.mean)} ${y+22} l4 4 l-4 4 l-4 -4z" fill="#fff" stroke="#172233" stroke-width="1.5"/>`:""}
 ${r.q?`<line x1="${x(r.q.lo)}" x2="${x(r.q.hi)}" y1="${y+14}" y2="${y+14}" stroke="#172233" stroke-width="2"/><line x1="${x(r.q.lo)}" x2="${x(r.q.lo)}" y1="${y+10}" y2="${y+18}" stroke="#172233" stroke-width="2"/><line x1="${x(r.q.hi)}" x2="${x(r.q.hi)}" y1="${y+10}" y2="${y+18}" stroke="#172233" stroke-width="2"/><circle cx="${x(r.q.pr)}" cy="${y+14}" r="4" fill="#172233"/>`:""}
 <text x="${W-R+8}" y="${y+18}" font-size="12.5" font-weight="700" fill="#172233">${(r.act*100).toFixed(1)}%</text></g>`}).join("");
 return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block" role="img" aria-label="Votos actuales y proyección estadística por partido">${g}${body}</svg></div>
 <div class="lg" style="margin-top:6px"><span><i style="background:#8491A3"></i>Barra: % actual (actas contabilizadas)</span>${q&&q.rows.length?`<span><i style="background:#172233;border-radius:50%"></i>Conteo rápido ± margen (${q.rep}/${q.n} mesas${q.final?"":", preliminar"})</span>`:`<span>Conteo rápido: sin datos de muestra</span>`}${w&&w.mc&&w.mc.sims?`<span>◇ Proyección final por escenarios (rango 90%)</span>`:`<span>Escenarios: desde 8 actas</span>`}</div>`}

const plogo=p=>p&&p.logo?`<img src="${p.logo}" style="height:15px;width:15px;object-fit:contain;vertical-align:-3px;margin-right:4px">`:"";
/* ---------- PDF escenarios y conteo rápido ---------- */
function pdfHead(t){const own=S.parties.find(p=>p.id===S.cfg.own);return `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0E1A2B;padding-bottom:6px;margin-bottom:10px"><div><div style="font-size:16px;font-weight:700">${t} · Sunampe ERM 2026</div><div style="font-size:11px">Corte: ${new Date().toLocaleString("es-PE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})} · uso interno${S.cfg.sim?" · SIMULACRO":""}</div></div><img src="${FULLLOGO||own.logo}" style="height:40px"></div>`}
const pbox=(l,v,s,c)=>`<div style="border:1px solid #C9D1DA;border-radius:6px;padding:7px 10px"><div style="font-size:10px;color:#5B6B7C">${l}</div><div style="font-size:19px;font-weight:700;${c?"color:"+c:""}">${v}</div><div style="font-size:9.5px;color:#5B6B7C">${s}</div></div>`;
const psec=t=>`<div style="font-weight:700;font-size:12.5px;margin:12px 0 5px;border-bottom:1px solid #DDE2E8;padding-bottom:3px">${t}</div>`;
function printEscenarios(){const w=winAnalysis(3000);const st=winStatus(w);const own=S.parties.find(p=>p.id===S.cfg.own);const col=st.c==="ok"?"#2E7D4F":st.c==="pen"?"#B7791F":"#1F4E79";const pf=x=>x==null?"—":x>.999?">99.9%":x<.001?"<0.1%":pc(x);
 $("printArea").innerHTML=pdfHead("Escenarios estadísticos")+`
 <div style="border:1px solid #C9D1DA;border-left:5px solid ${col};border-radius:4px;padding:7px 10px;font-size:11.5px;margin-bottom:10px"><b style="color:${col}">${h(st.t)}.</b> ${h(st.d)}</div>
 <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${pbox("Actas contabilizadas",w.n+"/"+w.N,pc(w.n/w.N)+" de mesas")}${pbox("Ventaja del 1.º",w.n?nf(w.L):"—",w.n?h(w.lead.p.sigla)+" sobre "+h(w.sec.p.sigla):"")}${pbox("Electores por contar",nf(w.R),w.rem+" mesas pendientes")}${pbox("Votos válidos esperados",w.n?nf(w.expV):"—","Según participación actual")}${pbox("Prob. 1.º se mantiene",w.decided?"100%":w.mc&&w.mc.aheadOf2!=null?pf(w.mc.aheadOf2):"—",w.mc&&w.mc.sims?nf(w.mc.sims)+" simulaciones":"",col)}</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div>${psec("Probabilidad de ganar la alcaldía")}${w.mc&&w.mc.sims?svgBars(w.rows.map(r=>({label:r.p.sigla,logo:r.p.logo,color:r.p.color,v:r.pw,txt:pf(r.pw),own:r.p.id===own.id})),1):w.decided?`<p style="font-size:11px"><b>${h(w.lead.p.name)}</b> ya es ganador matemático.</p>`:"<p style='font-size:11px'>Se requieren al menos 8 actas contabilizadas.</p>"}</div>
 <div>${psec("Regidores de "+h(own.name))}${w.mc&&w.mc.seatD?svgBars(w.mc.seatD.map(d=>({label:d.k+" reg.",color:"#C8102E",v:d.p,txt:pc(d.p,0),own:false})),1):"<p style='font-size:11px'>Disponible desde 8 actas contabilizadas.</p>"}</div></div>
 ${psec("Análisis por organización")}<table><tr><th>Organización</th><th class="r">Votos</th><th class="r">% actual</th><th class="r">Proyección</th><th>Rango 90%</th><th class="r">Prob. ganar</th><th class="r">Máx. posible</th><th>Para superar al 1.º</th></tr>${w.n?w.rows.map((r,k)=>`<tr ${r.p.id===own.id?'style="background:#FDECEE"':""}><td>${plogo(r.p)}<b>${h(r.p.sigla)}</b> ${h(r.p.name)}</td><td class="r">${nf(r.v)}</td><td class="r">${pc(w.T.v?r.v/w.T.v:0)}</td><td class="r"><b>${r.mean!=null?pc(r.mean):"—"}</b></td><td>${r.lo!=null?pc(r.lo)+" – "+pc(r.hi):"—"}</td><td class="r"><b>${r.pw!=null?pf(r.pw):w.decided?(k===0?"100%":"0%"):"—"}</b></td><td class="r">${nf(r.max)}</td><td>${k===0?"Líder":r.elim?"Eliminado matemáticamente":r.need!=null?(r.need>1?"Imposible en la práctica":"+"+(r.need*100).toFixed(1)+" pts sobre el líder"):"—"}</td></tr>`).join(""):'<tr><td colspan="8">Sin actas contabilizadas.</td></tr>'}</table>
 ${S.cortes.some(c=>c.win)?psec("Evolución por corte")+`<table><tr><th>Corte</th><th>Hora</th><th class="r">Actas</th><th>Líder</th><th class="r">Ventaja</th><th class="r">Prob. se mantiene</th><th>Estado</th></tr>${S.cortes.filter(c=>c.win).slice(-10).map(c=>`<tr><td>${c.cierre?"Cierre":"N.º "+c.n}</td><td>${hm(c.t)}</td><td class="r">${c.cnt}</td><td>${h(c.win.lead)}</td><td class="r">${nf(c.win.L)}</td><td class="r">${c.win.p!=null?pf(c.win.p):"—"}</td><td>${h(c.win.st)}</td></tr>`).join("")}</table>`:""}
 <div style="font-size:9px;color:#5B6B7C;margin-top:10px">Método: certeza matemática si la ventaja supera a todos los electores pendientes; probabilidades por ${nf(3000)} simulaciones que completan cada mesa pendiente con mesas ya contadas del mismo colegio (bootstrap estratificado), ajustadas a sus electores. Las actas no llegan al azar: contrastar con el conteo rápido. Proyección referencial, no es resultado oficial.</div>`;window.print()}
function printConteo(){const M=S.muestra;const q=quick();const own=S.parties.find(p=>p.id===S.cfg.own);
 if(!M){toast("Primero genera y sella la muestra.");return}
 const E=[2,3,4,5].map(e=>[e,sizeFor(e/100,M.conf||95,.08)]);
 $("printArea").innerHTML=pdfHead("Conteo rápido")+`
 <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${pbox("Mesas de muestra",M.mesas.length,"de "+S.mesas.length+" mesas")}${pbox("Reportadas",q.rep+"/"+q.n,pc(q.n?q.rep/q.n:0,0)+" de la muestra",q.final?"#2E7D4F":"#B7791F")}${pbox("Estado",q.final?"Suficiente":"Preliminar",q.final?"≥ 80% de la muestra":"Faltan "+Math.max(0,Math.ceil(.8*q.n)-q.rep)+" mesas")}${pbox("Confianza",(M.conf||95)+"%","Estratificada por colegio")}${pbox("Código de muestra",M.code,"Sellada "+dt(M.ts))}</div>
 ${q.tie?`<div style="border:1px solid #F6C9D0;background:#FDECEE;border-radius:4px;padding:6px 10px;margin-top:8px;font-size:11px"><b>Empate técnico:</b> los intervalos de ${h(q.rows[0].p.name)} y ${h(q.rows[1].p.name)} se cruzan; no se puede señalar ganador con este nivel de confianza.</div>`:""}
 ${psec("Proyección con intervalo de confianza")}${q.rows.length?`<div style="max-width:520px">${svgIntervals(q)}</div>`:"<p style='font-size:11px'>Aún no hay actas contabilizadas de mesas de muestra.</p>"}
 ${q.rows.length?`<table><tr><th>Organización</th><th class="r">% estimado</th><th class="r">Margen</th><th>Intervalo ${M.conf}%</th></tr>${q.rows.map(r=>`<tr ${r.p.id===own.id?'style="background:#FDECEE"':""}><td>${plogo(r.p)}<b>${h(r.p.sigla)}</b> ${h(r.p.name)}</td><td class="r"><b>${pc(r.pr)}</b></td><td class="r">± ${(r.moe*100).toFixed(1)} pts</td><td>${pc(r.lo)} – ${pc(r.hi)}</td></tr>`).join("")}</table>`:""}
 ${psec("Mesas de muestra por colegio")}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${S.locales.map(l=>{const ms=M.mesas.filter(id=>mesa(id).localId===l.id);const r=ms.filter(id=>S.actas[id]&&S.actas[id].estado==="Contabilizada").length;const c=!ms.length?"#8A96A3":r===ms.length?"#2E7D4F":r?"#B7791F":"#C62828";return `<div style="border:1px solid #C9D1DA;border-left:4px solid ${c};border-radius:4px;padding:5px 8px;font-size:10px"><div style="display:flex;justify-content:space-between"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.n}. ${h(l.name)}</b><b>${r}/${ms.length}</b></div>${ms.map(id=>`<span style="display:inline-block;margin:2px 3px 0 0;padding:0 5px;border-radius:3px;background:${S.actas[id]&&S.actas[id].estado==="Contabilizada"?"#E7F4EC":"#FDECEE"}">${h(mnum(mesa(id)))}</span>`).join("")}</div>`}).join("")}</div>
 <div style="font-size:9.5px;color:#5B6B7C;margin-top:3px">Verde = acta contabilizada · rojo = falta reportar o está observada.</div>
 ${psec("Ficha técnica")}<div style="font-size:10.5px">Universo: ${S.mesas.length} mesas y ${nf(S.mesas.reduce((a,m)=>a+(+m.elect||0),0))} electores hábiles (ONPE, ficha técnica ERM 2026 v06). Muestra: ${M.mesas.length} mesas, aleatoria estratificada por colegio con asignación proporcional, sellada el ${dt(M.ts)} por ${h(M.user||"—")}, código ${M.code}. Estimador de razón con ponderación por estrato y corrección por población finita. Confianza ${M.conf}%. Tamaños de referencia (variación media entre mesas): ${E.map(([e,n])=>`±${e} pts → ${n} mesas`).join(" · ")}. Proyección estadística de uso interno, no es resultado oficial.</div>`;window.print()}

function posMoves(){const s=statsCore();const ps=P();const cur=ps.map(p=>({id:p.id,v:s.T.t[p.id]})).sort((a,b)=>b.v-a.v).map(x=>x.id);const c=[...S.cortes].reverse().find(c=>c.T&&c.T.v);const prev=c?ps.map(p=>({id:p.id,v:c.T.t[p.id]||0})).sort((a,b)=>b.v-a.v).map(x=>x.id):null;const r={};cur.forEach((id,i)=>{const j=prev?prev.indexOf(id):-1;r[id]={pos:i+1,d:j<0?0:j-i}});return r}
const mvH=d=>d>0?`<span style="color:var(--green);font-size:11px;font-weight:700">▲${d}</span>`:d<0?`<span style="color:var(--red);font-size:11px;font-weight:700">▼${-d}</span>`:`<span class="muted" style="font-size:11px">＝</span>`;
function printResultados(){const s=statsCore();const ps=P();const votes=ps.map(p=>s.T.t[p.id]);const seats=seatsCalc(votes);const own=S.parties.find(p=>p.id===S.cfg.own);const mv=posMoves();const ord=ps.map((p,i)=>({p,i,v:votes[i]})).sort((a,b)=>b.v-a.v);
 const cols=S.locales.map(l=>{const T=totals(counted().filter(a=>mesa(a.mesaId).localId===l.id));const o=ps.map(p=>({p,v:T.t[p.id]})).sort((a,b)=>b.v-a.v);const ms=S.mesas.filter(m=>m.localId===l.id);return{l,T,o,n:ms.length,c:ms.filter(m=>S.actas[m.id]&&S.actas[m.id].estado==="Contabilizada").length}});
 $("printArea").innerHTML=pdfHead("Resultados y regidores")+`
 <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${pbox("Actas contabilizadas",s.c.length+"/"+s.N,pc(s.c.length/s.N)+" de avance")}${pbox("Votos válidos",nf(s.T.v),"Emitidos "+nf(s.T.em))}${pbox("Blancos / nulos",nf(s.T.bl)+" / "+nf(s.T.nu),"Impugnados "+nf(s.T.imp))}${pbox("Participación",pc(s.part),"Sobre electores de mesas contadas")}${pbox(h(own.sigla)+" · posición",s.T.v?mv[own.id].pos+"º":"—",s.T.v?pc(s.T.t[own.id]/s.T.v)+" · "+seats[ps.indexOf(own)]+" regidor(es)":"","#C8102E")}</div>
 <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px"><div>${psec("Votos por organización (% de válidos)")}${s.T.v?svgBars(ord.map(o=>({label:o.p.sigla,logo:o.p.logo,color:o.p.color,v:o.v/s.T.v,txt:pc(o.v/s.T.v)+" ("+nf(o.v)+")",own:o.p.id===own.id}))):"<p style='font-size:11px'>Sin actas contabilizadas.</p>"}</div>
 <div>${psec("Proyección de regidores ("+S.cfg.regidores+")")}${s.T.v?svgBars(ord.filter(o=>seats[o.i]).map(o=>({label:o.p.sigla,logo:o.p.logo,color:o.p.color,v:seats[o.i],txt:seats[o.i]+" regidor"+(seats[o.i]>1?"es":""),own:o.p.id===own.id})),S.cfg.regidores):"<p style='font-size:11px'>Sin datos.</p>"}<div style="font-size:9.5px;color:#5B6B7C">La lista ganadora recibe la mitad más uno (${Math.floor(S.cfg.regidores/2)+1}); el resto por cifra repartidora. Referencial: la asignación oficial la hace el JEE.</div></div></div>
 ${psec("Tabla de posiciones")}<table><tr><th class="r">Pos.</th><th>Mov.</th><th>Organización</th><th>Candidato a alcaldía</th><th class="r">Votos</th><th class="r">% válidos</th><th class="r">% emitidos</th><th class="r">Regidores</th></tr>${ord.map(o=>`<tr ${o.p.id===own.id?'style="background:#FDECEE"':""}><td class="r"><b>${mv[o.p.id].pos}º</b></td><td>${mvH(mv[o.p.id].d)}</td><td>${plogo(o.p)}<b>${h(o.p.sigla)}</b> ${h(o.p.name)}</td><td>${h(o.p.cand||"")}</td><td class="r">${nf(o.v)}</td><td class="r"><b>${pc(s.T.v?o.v/s.T.v:0,2)}</b></td><td class="r">${pc(s.T.em?o.v/s.T.em:0,2)}</td><td class="r"><b>${s.T.v?seats[o.i]:"—"}</b></td></tr>`).join("")}</table>
 <div style="font-size:9.5px;color:#5B6B7C">Mov.: cambio de posición respecto al último corte.</div>
 ${psec("Resultados por colegio")}<table><tr><th>Colegio</th><th class="r">Actas</th><th>1.º lugar</th><th>2.º lugar</th><th class="r">${h(own.sigla)} %</th><th class="r">${h(own.sigla)} pos.</th></tr>${cols.map(x=>`<tr><td>${x.l.n}. ${h(x.l.name)}</td><td class="r">${x.c}/${x.n}</td><td>${x.T.v?`${plogo(x.o[0].p)}<b>${h(x.o[0].p.sigla)}</b> ${pc(x.o[0].v/x.T.v)}`:"—"}</td><td>${x.T.v?`${plogo(x.o[1].p)}${h(x.o[1].p.sigla)} ${pc(x.o[1].v/x.T.v)}`:"—"}</td><td class="r">${x.T.v?pc(x.T.t[own.id]/x.T.v):"—"}</td><td class="r">${x.T.v?(x.o.findIndex(o=>o.p.id===own.id)+1)+"º":"—"}</td></tr>`).join("")}</table>
 <div style="font-size:9px;color:#5B6B7C;margin-top:8px">Resultados parciales con actas contabilizadas; no son resultados oficiales, que solo publica la ONPE.</div>`;window.print()}

function lockScreen(){$("overlay").innerHTML=`<div class="lock"><div class="card f"><img src="${ICON}" style="width:56px;margin:auto"><h2 style="margin:0">Sunampe ERM 2026</h2><p class="muted" style="margin:0">Centro de cómputo · uso interno</p><input type="password" id="pin" inputmode="numeric" placeholder="PIN" style="text-align:center;font-size:18px" onkeydown="if(event.key==='Enter')unlock()"><div id="pinM"></div><button class="btn p" onclick="unlock()">Ingresar</button></div></div>`;setTimeout(()=>$("pin").focus(),50)}
function unlock(){if($("pin").value===S.cfg.pin){closeM();log("Ingreso","")}else $("pinM").innerHTML='<div class="alert">PIN incorrecto.</div>'}
(async()=>{
 try{db=await openDB();await bkLoad();const {data:{session}}=await sbClient.auth.getSession();if(!session){showLogin();return}await sbLoadState();render();setInterval(bkTick,60000);setInterval(async()=>{if(["panel","avance"].includes(page)&&!document.querySelector("main :focus")&&!$("overlay").innerHTML){try{await sbLoadState();render()}catch(e){console.warn(e)}}},30000)}catch(e){console.error(e);showLogin(e.message||"No se pudo iniciar el sistema")}})();
</script>
